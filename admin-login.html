<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inkora Ventures | Admin Login</title>
<style>
:root{--ink:#650C0D;--gold:#FEBE0F;--paper:#FFF8F0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);font-family:Inter,system-ui,sans-serif;color:var(--ink)}.card{width:min(440px,92%);background:#fff;border:1px solid #eadfd4;border-radius:28px;padding:34px;box-shadow:0 24px 70px rgba(101,12,13,.12)}.brand{text-align:center;margin-bottom:24px}.brand img{height:58px;max-width:220px;object-fit:contain;margin:auto}h1{margin:8px 0;font-size:2rem}p{color:#6f7075}label{display:block;font-size:.8rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin:15px 0 7px}input{width:100%;padding:14px;border:1px solid #ded5ca;border-radius:12px;font:inherit}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:900;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:12px;background:#fff6dc;display:none}a{color:var(--ink);font-weight:800}
</style></head><body><main class="card"><div class="brand"><img src="inkora_logo_preview.png" alt="Inkora Ventures"></div><h1>Admin login</h1><p>Sign in to manage Inkora Ventures website content.</p>
<form id="login"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button>Sign in</button></form><div id="msg" class="msg"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const sb=supabase.createClient(window.INKORA_SUPABASE.url,window.INKORA_SUPABASE.publishableKey);
const msg=document.getElementById('msg'); const show=t=>{msg.textContent=t;msg.style.display='block'};
sb.auth.getSession().then(async({data})=>{if(data.session) location.href='admin-dashboard.html'});
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();msg.style.display='none';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return show(error.message);location.href='admin-dashboard.html'});
</script></body></html>
